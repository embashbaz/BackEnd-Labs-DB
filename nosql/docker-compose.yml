# MongoDB for the NoSQL part of the Smart E-Commerce project.
#   Start:            docker compose up -d
#   Open a shell:     docker exec -it smart-ecommerce-mongo mongosh smart_ecommerce
#   Run the queries:  docker exec -it smart-ecommerce-mongo mongosh smart_ecommerce /scripts/queries.js
#   Stop:             docker compose down        (keeps the data)
#   Reset completely: docker compose down -v     (deletes the data; init runs again on next start)

services:
  mongo:
    image: mongo:7.0
    container_name: smart-ecommerce-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_ecommerce
    volumes:
      - mongo-data:/data/db
      # Scripts here run automatically the FIRST time the container starts with an empty volume
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/scripts:ro

volumes:
  mongo-data:
